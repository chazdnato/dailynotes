# Requires stages validate, release and renovate_bot
stages:
  - validate
  - release
  - renovate_bot

include:
  - local: .gitlab-ci-asdf-versions.yml

  # This template should be included in all Infrastructure projects.
  # It includes standard checks, gitlab-scanners, validations and release processes
  # common to all projects using this template library.
  # see https://gitlab.com/gitlab-com/gl-infra/common-ci-tasks/-/blob/main/README.md#templatesstandardyml
  - project: 'gitlab-com/gl-infra/common-ci-tasks'
    ref: v4.19  # renovate:managed
    file: templates/standard.yml

  # Runs golang standard tests, including tests, goreleaser, golangci-lint and go-mod-tidy
  # see https://gitlab.com/gitlab-com/gl-infra/common-ci-tasks/-/blob/main/templates/golang.md
  - project: 'gitlab-com/gl-infra/common-ci-tasks'
    ref: v4.19  # renovate:managed
    file: templates/golang.yml

# Override .renovate_bot_auth_config to use CI/CD variables instead of Vault.
# VAULT_RENOVATE_GITLAB_TOKEN_PATH is inherited but Vault is not available in
# this project. Both tokens are provided as inherited CI/CD variables.
#.renovate_bot_auth_config:
#  variables:
#    RENOVATE_BOT_AUTH_SOURCE: "CI/CD Variables"

renovate_bot:
  extends:
  - ".base_renovate_bot"
  variables:
    RENOVATE_BOT_AUTH_SOURCE: "CI/CD Variables"
